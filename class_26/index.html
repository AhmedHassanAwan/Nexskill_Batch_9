<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
       <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 30px;
        }

        .navbar {
            background: #f85606;
            color: white;
            padding: 18px 25px;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 30px;
            border-radius: 5px;
        }

        #div {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 5px;
            overflow: hidden;
            transition: 0.3s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: contain;
            padding: 10px;
            background: white;
        }

        .card-content {
            padding: 12px;
        }

        .card h2 {
            font-size: 15px;
            font-weight: normal;
            line-height: 1.5;
            height: 45px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .price {
            color: #f85606;
            font-size: 23px;
            margin-bottom: 5px;
        }

        .old-price {
            color: #999;
            text-decoration: line-through;
            font-size: 13px;
        }

        .discount {
            color: #555;
            font-size: 12px;
            margin-left: 5px;
        }

        .rating {
            color: #f5a623;
            font-size: 14px;
            margin: 10px 0;
        }

        .description {
            color: #777;
            font-size: 12px;
            line-height: 1.5;
            height: 54px;
            overflow: hidden;
        }

        .stock {
            color: #16803c;
            font-size: 12px;
            margin: 10px 0;
        }

        .buy-btn {
            width: 100%;
            background: #f85606;
            color: white;
            border: none;
            padding: 11px;
            border-radius: 3px;
            font-size: 14px;
            cursor: pointer;
        }

        .buy-btn:hover {
            background: #dc4900;
        }

        @media (max-width: 500px) {
            body {
                padding: 12px;
            }

            #div {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }

            .card img {
                height: 150px;
            }

            .card-content {
                padding: 9px;
            }

            .card h2 {
                font-size: 13px;
            }

            .price {
                font-size: 19px;
            }
        }
    </style>
</head>
<body>

    <!-- <h1>hellow js</h1> -->


    <!-- <h1 id="h1"></h1> -->


   
    <div class="navbar">daraz</div>

    <div id="div"></div>
    


    <script src="app.js"></script>
</body>
</html>
