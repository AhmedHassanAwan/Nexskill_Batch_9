<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            padding: 30px;
        }

       #div{
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 30px;
       }

        .card {
            width: 250px;
            background: #fff;
            border-radius: 5px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.3s;
        }

        .card:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            transform: translateY(-5px);
        }

        .image-box {
            position: relative;
            width: 100%;
            height: 230px;
            padding: 15px;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .discount {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #f85606;
            color: white;
            padding: 5px 8px;
            font-size: 12px;
            border-radius: 3px;
        }

        .card-content {
            padding: 12px;
        }

        .card h2 {
            font-size: 15px;
            font-weight: 400;
            color: #333;
            line-height: 1.5;
            height: 45px;
            overflow: hidden;
        }

        .price {
            color: #f85606;
            font-size: 21px;
            margin-top: 10px;
        }

        .old-price {
            color: #999;
            font-size: 12px;
            margin-top: 5px;
        }

        .old-price span {
            text-decoration: line-through;
        }

        .rating {
            margin-top: 10px;
            font-size: 13px;
            color: #f5a623;
        }

        .rating span {
            color: #777;
        }

        .stock {
            color: #159447;
            font-size: 12px;
            margin-top: 10px;
        }

        .buy-btn {
            width: 100%;
            border: none;
            background: #f85606;
            color: white;
            padding: 11px;
            margin-top: 12px;
            border-radius: 3px;
            font-size: 14px;
            cursor: pointer;
        }

        .buy-btn:hover {
            background: #d94700;
        }
    </style>
</head>
<body>

    <!-- <h1>hellow js</h1> -->


    <!-- <h1 id="h1"></h1> -->


   
    <div class="navbar">daraz</div>

    <div id="div">
        
    </div>
    


    <script src="app.js"></script>
</body>
</html>
